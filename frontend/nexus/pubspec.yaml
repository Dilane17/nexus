name: nexus
description: Plateforme de prêt Peer-to-Peer Nexus - Bénin (UEMOA)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.41.7"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  http: ^1.2.0

  # State Management
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.2.2

  # Networking
  dio: ^5.9.2

  # Storage sécurisé (JWT tokens)
  flutter_secure_storage: ^10.0.0

  # Local storage offline (KYC partiel, simulateur, etc.)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Modèles immutables
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI & UX
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3 # Skeletons loaders (recommandé 2026)
  fluttertoast: ^9.0.0
  intl: ^0.20.2 # Formatage FCFA, dates, nombres
  connectivity_plus: ^7.1.1 # Détection offline

  # Images & fichiers
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Autres utils
  flutter_dotenv: ^6.0.1 # Pour .env (BASE_URL backend)
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
  # fonts: (on ajoutera plus tard pour support Fon/Nago si besoin)
